<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
        div{
            border: 10px solid black;
        }
        .d1{
            height: 100vh;
            width: 100%;
            background-color: burlywood;
        }
        .header{
            height: 25%;
            width: 100%;
            background-color: blue;
        }
        .middle{
            height: 50%;
            width: 100%;
            background-color: blueviolet;
           display: flex;
        }
        .footer{
            height:25%;
            width:100%;
            background-color: brown;
            display: flex;
        }
        .left{
            height:100%;
            width:25%;
            background-color: beige;
            display: flex;
        }
        .right{
            height:100%;
            width:75%;
            background-color: azure;
        }
        .up{
            height:50%;
            width:100%;
            background-color: pink;
        }
        .down{
            height:50%;
            width:100%;
            background-color: peru;
        }
    </style>
</head>
<body>
    <div class = "d1">
        <div class = "header"></div>
        <div class= "middle">
            <div class="left"></div>
            <div class="right">
                <div class="up"></div>
                <div class="down"></div>
            </div>
        </div>
        <div class= "footer"></div>
        </div>
</body>
</html>
